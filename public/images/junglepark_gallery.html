<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Park Gallery Inspector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .filename {
            font-weight: bold;
            font-size: 1.1rem;
            color: #555;
        }
        .dimensions {
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <h1>Jungle Park Gallery Inspector</h1>
    <div class="grid">
        <!-- Script to generate this dynamically, or let's just write them out -->
        <!-- p1.png is empty, we exclude it -->
        <div class="card"><img src="./junglepark/p2.png" alt="p2"><div class="filename">p2.png</div></div>
        <div class="card"><img src="./junglepark/p3.png" alt="p3"><div class="filename">p3.png</div></div>
        <div class="card"><img src="./junglepark/p4.png" alt="p4"><div class="filename">p4.png</div></div>
